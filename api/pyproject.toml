# Tool configuration for the central API. Dependencies live in
# requirements.txt and requirements-dev.txt.

[tool.ruff]
# Google Python Style Guide: 80 columns, 4-space indent.
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the behaviour; docstrings would repeat them.
"*_test.py" = ["D"]

[tool.pytest.ini_options]
# Tests sit next to the code as <name>_test.py, as in the frontend.
python_files = ["*_test.py"]
pythonpath = ["."]
