# nginx for the frontend container: serves the built app and forwards the
# two things the browser must reach on this same origin.

# ChatGPT relay requests per client address. A summary or a chat answer is
# one request, so this only stops someone using the relay in bulk.
limit_req_zone $binary_remote_addr zone=codex_relay:10m rate=2r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The central API (docs/CENTRAL_API_CONTRACT.md). /api/companies/AAPL
    # becomes http://central:8000/companies/AAPL.
    location /api/ {
        proxy_pass http://central:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The first request for a company waits on the data providers.
        proxy_read_timeout 60s;
    }

    # Relay for readers who signed in with a ChatGPT plan. chatgpt.com only
    # accepts browser requests from its own pages, so the page sends them
    # here and nginx passes them on, the way CLIProxyAPI does. Nothing is
    # stored: the reader's token is in the Authorization header, which the
    # default access log does not record.
    location = /ai-proxy/codex/responses {
        limit_except POST {
            deny all;
        }
        limit_req zone=codex_relay burst=10 nodelay;
        client_max_body_size 1m;

        proxy_pass https://chatgpt.com/backend-api/codex/responses;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host chatgpt.com;
        # Drop what identifies the browser page; chatgpt.com sees the
        # request as coming from the Codex app. Keep the user agent in step
        # with CODEX_USER_AGENT in vite.config.ts.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header User-Agent "codex-tui/0.154.0 (Mac OS 26.5.2; arm64) iTerm.app/3.6.11 (codex-tui; 0.154.0)";
        proxy_hide_header Set-Cookie;

        # Stream the answer to the browser as it arrives.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Everything else is the single-page app; React Router handles the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
