name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: ${{ matrix.service }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [central_api, scrapper_api, scheduler]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt pytest ruff
      # Syntax errors, undefined names and unused imports. The services are
      # not yet formatted to the 80-column Google style, so no style rules.
      - run: ruff check --select F,E9 .
      # Database and deployment tests skip themselves without their services.
      - run: python -m pytest -q
