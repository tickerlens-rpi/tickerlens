services:
  frontend:
    build: ./frontend
    image: frontend-image
    container_name: frontend-container
    ports:
      - "80:80"
    restart: unless-stopped

  scrapper:
    build: ./scrapper_api
    image: scrapper-image
    container_name: scrapper-container
    env_file:
      - ./scrapper_api/.env
    ports:
      - "8001:8001"
    restart: unless-stopped